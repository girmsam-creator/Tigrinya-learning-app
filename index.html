<style>
/* Layout: one column phone app. Header on top, single working area, fixed bottom tab bar.
   Ge'ez text always uses the ochre token so Tigrinya stays visually separate from Finnish. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#e1e9e7; --ink:#1b2a29; --dim:#5b6e6c;
  --accent:#0f6b66; --accent-ink:#ffffff; --ochre:#a35a00; --good:#1f7a3d; --bad:#b3261e; --line:#c9d6d3;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101716; --surface:#18221f; --surface-2:#223330; --ink:#e8f0ee; --dim:#9fb3b0;
    --accent:#4fc1b8; --accent-ink:#0b1f1d; --ochre:#f0a24a; --good:#6fd08c; --bad:#ff8a80; --line:#2f4541;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101716; --surface:#18221f; --surface-2:#223330; --ink:#e8f0ee; --dim:#9fb3b0;
  --accent:#4fc1b8; --accent-ink:#0b1f1d; --ochre:#f0a24a; --good:#6fd08c; --bad:#ff8a80; --line:#2f4541;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0;text-wrap:balance}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
header h1{font-size:1.5rem}

.geez{font-family:"Noto Serif Ethiopic",serif;color:var(--ochre);font-weight:700}
.ph{color:var(--ochre);font-style:italic}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;min-width:0}

select,button{font:inherit;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;max-width:100%;flex:1;min-width:0}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer;font-weight:600;flex:1}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:focus-visible,select:focus-visible,.tab:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:100%}
.seg button{flex:1;background:var(--surface);border:0;padding:10px;min-height:44px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;cursor:pointer;padding:12px;border-radius:16px;background:var(--surface-2);border:1px dashed var(--line)}
.card .big{font-size:2rem;line-height:1.2;overflow-wrap:anywhere}
.card .hint{font-size:.8rem;color:var(--dim)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;min-height:52px;text-align:left;cursor:pointer;font-size:1rem}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-weight:600;cursor:pointer;color:var(--ochre);font-style:italic}
.answer{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.msg{font-weight:600;margin:8px 0}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
.qa{border-top:1px solid var(--line);padding:10px 0}
.qa button{width:100%;text-align:left;background:none;border:0;padding:0;font-weight:600;cursor:pointer}
.qa .a{margin-top:4px;color:var(--good);font-weight:600}
.fid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:8px 0}
.fid div{background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 0;min-width:0}
.fid .g{font-family:"Noto Serif Ethiopic",serif;font-size:1.4rem;color:var(--ochre);font-weight:700;line-height:1.3}
.fid .p{font-size:.68rem;color:var(--dim)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tab{flex:1;background:none;border:0;padding:8px 1px;min-height:48px;font-size:.66rem;font-weight:600;color:var(--dim);cursor:pointer;border-radius:10px;min-width:0}
.tab[aria-selected="true"]{color:var(--accent);background:var(--surface-2)}
.tab b{font-family:"Noto Serif Ethiopic","IBM Plex Sans",sans-serif;display:block;font-size:1.15rem;font-weight:700;line-height:1.2}
.small{font-size:.82rem;color:var(--dim)}
.msg{padding:10px 12px;border-radius:14px;background:var(--surface-2);margin:8px 0;max-width:90%}
.msg.me{margin-left:auto;background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.msg .who{font-size:.72rem;color:var(--dim);font-weight:600}
.msg .ph{font-size:1.15rem}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>

// ---- content.txt parser: the app reads this file from the same folder, so adding lines adds content ----
function parseContent(txt){
  const out={decks:[],sentences:[],reading:[],listening:[],fidel:[],convos:[]};
  let mode=null, cur=null;
  const parts=(s)=>s.split("|").map(x=>x.trim());
  for(let raw of txt.split(/\r?\n/)){
    const line=raw.trim(); if(!line||line.startsWith("//"))continue;
    if(line.startsWith("## ")){const [a,b]=parts(line.slice(3)); cur={id:"d"+out.decks.length,group:b?a:"Omat",label:b||a,cards:[]}; out.decks.push(cur); mode="deck"; continue}
    if(/^#SENTENCES/i.test(line)){mode="sent";continue}
    if(/^#READING/i.test(line)){cur={title:line.replace(/^#READING\s*/i,"")||"Teksti",ph:"",qs:[]};out.reading.push(cur);mode="read";continue}
    if(/^#LISTENING/i.test(line)){cur={title:line.replace(/^#LISTENING\s*/i,"")||"Harjoitus",ph:"",qs:[]};out.listening.push(cur);mode="listen";continue}
    if(/^#CONVERSATION/i.test(line)){cur={title:line.replace(/^#CONVERSATION\s*/i,"")||"Keskustelu",lines:[]};out.convos.push(cur);mode="convo";continue}
    if(/^#FIDEL/i.test(line)){const [n,s]=parts(line.replace(/^#FIDEL\s*/i,""));cur={name:n||"Fidel",src:s||"",p:[],g:[],words:[]};out.fidel.push(cur);mode="fidel";continue}
    if(mode==="deck"){const f=parts(line); if(f.length>=3)cur.cards.push({ph:f[0],tg:f[1],fi:f[2]}); else if(f.length===2)cur.cards.push({ph:f[0],tg:"",fi:f[1]})}
    else if(mode==="sent"){const f=parts(line); if(f.length>=2)out.sentences.push({ph:f[0],fi:f[1],src:f[2]||""})}
    else if(mode==="read"||mode==="listen"){ if(line.startsWith("?")){const f=parts(line.slice(1)); cur.qs.push([f[0],f[1]||""])} else cur.ph=(cur.ph?cur.ph+" ":"")+line }
    else if(mode==="convo"){const m=line.match(/^([AB]):\s*(.*)$/); if(m){const f=parts(m[2]); cur.lines.push({s:m[1],ph:f[0],fi:f[1]||""})}}
    else if(mode==="fidel"){ if(/^word:/i.test(line)){const f=parts(line.replace(/^word:/i,"")); cur.words.push([f[0],f[1]||"",f[2]||""])} else {const f=parts(line); cur.g=f[0].split(/\s+/); cur.p=(f[1]||"").split(/\s+/)} }
  }
  out.decks=out.decks.filter(d=>d.cards.length);
  out.reading=out.reading.filter(r=>r.ph&&r.qs.length);
  out.listening=out.listening.filter(r=>r.ph&&r.qs.length);
  out.fidel=out.fidel.filter(f=>f.g.length&&f.g.length===f.p.length);
  out.convos=out.convos.filter(c=>c.lines.length>=2);
  return out;
}
async function loadContent(){
  try{
    const r=await fetch("content.txt?v="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("http "+r.status);
    const c=parseContent(await r.text());
    if(c.decks.length){ D={decks:c.decks,sentences:c.sentences.length?c.sentences:EMBEDDED.sentences,reading:c.reading.length?c.reading:EMBEDDED.reading,listening:c.listening.length?c.listening:EMBEDDED.listening,fidel:c.fidel.length?c.fidel:EMBEDDED.fidel,convos:c.convos.length?c.convos:(EMBEDDED.convos||[])}; return "file"; }
  }catch(e){}
  return "embedded";
}

function deckOptions(sel){
  const groups={};
  DECKS.forEach(d=>{(groups[d.group]=groups[d.group]||[]).push(d)});
  sel.innerHTML = '<option value="__all">Kaikki sanat</option>'+Object.keys(groups).map(g=>'<optgroup label="'+g+'">'+groups[g].map(d=>'<option value="'+d.id+'">'+d.label+' ('+d.cards.length+')</option>').join("")+'</optgroup>').join("");
  if(store.deck) sel.value = store.deck;
}
const getDeck = (id)=> id==="__all"||!id ? allCards : (DECKS.find(d=>d.id===id)||{cards:allCards}).cards;
const key = (c)=>c.ph+"|"+c.fi;
function front(c){ return (c.tg?'<div class="big geez">'+c.tg+'</div>':'')+'<div class="big ph">'+c.ph+'</div>'; }
function updateStat(){ const t=store.stats, n=$("#stat").dataset.n||""; $("#stat").textContent = [n, t.q? ("Visa: "+t.ok+"/"+t.q+" oikein"):""].filter(Boolean).join(" | "); }

// ---- views ----
const views = {};

views.cards = (root)=>{
  let dir = store.dir||"tf", cur=null, flipped=false;
  root.innerHTML = '<div class="panel"><div class="row"><select id="deck" aria-label="Sanasto"></select></div>'+
    '<div class="seg" id="dir"><button data-d="tf">Tigrinya → suomi</button><button data-d="ft">Suomi → tigrinya</button></div>'+
    '<div class="card" id="card" role="button" tabindex="0" aria-label="Käännä kortti"></div>'+
    '<div class="row" id="grade" hidden><button class="btn bad" id="again">Uudestaan</button><button class="btn good" id="know">Osasin</button></div>'+
    '<div class="row"><div class="bar" style="flex:1"><i id="prog"></i></div><span class="small" id="progt"></span></div></div>';
  deckOptions($("#deck"));
  const cards = ()=>getDeck($("#deck").value);
  function pick(){
    const cs = cards(); const weights = cs.map(c=>{const b=store.box[key(c)]||0; return b>=3?1:(4-b)*3});
    let tot=weights.reduce((a,b)=>a+b,0), r=Math.random()*tot, i=0;
    for(;i<cs.length;i++){r-=weights[i]; if(r<=0)break}
    let c=cs[Math.min(i,cs.length-1)]; if(cs.length>1&&cur&&key(c)===key(cur)) c=cs[(cs.indexOf(c)+1)%cs.length];
    return c;
  }
  function render(){
    if(!cur) cur=pick();
    const frontHtml = dir==="tf" ? front(cur) : '<div class="big">'+cur.fi+'</div>';
    const backHtml = dir==="tf" ? '<div class="big">'+cur.fi+'</div>' : front(cur);
    $("#card").innerHTML = flipped ? backHtml+'<div class="hint">Osasitko?</div>' : frontHtml+'<div class="hint">Napauta kääntääksesi</div>';
    $("#grade").hidden = !flipped;
    document.querySelectorAll("#dir button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.d===dir)));
    const cs=cards(), known=cs.filter(c=>(store.box[key(c)]||0)>=3).length;
    $("#prog").style.width=(known/cs.length*100)+"%"; $("#progt").textContent=known+"/"+cs.length+" opittu";
  }
  const flip=()=>{flipped=!flipped;render()};
  $("#card").onclick=flip; $("#card").onkeydown=(e)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
  function grade(ok){const k=key(cur);store.box[k]=ok?Math.min(3,(store.box[k]||0)+1):0;save();cur=null;flipped=false;cur=pick();render()}
  $("#know").onclick=()=>grade(true); $("#again").onclick=()=>grade(false);
  $("#deck").onchange=()=>{store.deck=$("#deck").value;save();cur=null;flipped=false;render()};
  $("#dir").onclick=(e)=>{const d=e.target.dataset.d;if(d){dir=d;store.dir=d;save();flipped=false;render()}};
  render();
};

views.quiz = (root)=>{
  let dir=store.qdir||"tf", n=0, score=0, total=10, wrong=[], order=[];
  root.innerHTML='<div class="panel"><div class="row"><select id="deck" aria-label="Sanasto"></select></div>'+
   '<div class="seg" id="dir"><button data-d="tf">Tigrinya → suomi</button><button data-d="ft">Suomi → tigrinya</button></div>'+
   '<div id="qbox"></div></div>';
  deckOptions($("#deck"));
  function start(){const cs=getDeck($("#deck").value);order=shuffle(cs).slice(0,total);n=0;score=0;wrong=[];ask()}
  function ask(){
    const box=$("#qbox"); const cs=getDeck($("#deck").value);
    if(n>=order.length){
      box.innerHTML='<h2 style="margin:14px 0 6px">'+score+' / '+order.length+'</h2><p>'+(score===order.length?"Täydet pisteet!":"Hyvä alku, kertaa virheet alta.")+'</p>'+
        (wrong.length?'<div class="small">Kertaa:</div>'+wrong.map(c=>'<div class="qa"><span class="geez">'+(c.tg||"")+'</span> <span class="ph">'+c.ph+'</span> = '+c.fi+'</div>').join(""):"")+
        '<div class="row"><button class="btn primary" id="again">Uusi kierros</button></div>';
      $("#again").onclick=start; return;
    }
    const c=order[n]; const pool=cs.length>=4?cs:allCards;
    let opts=[c]; const used=new Set([dir==="tf"?c.fi:c.ph]);
    for(const x of shuffle(pool)){ if(opts.length>=4)break; const v=dir==="tf"?x.fi:x.ph; if(!used.has(v)){used.add(v);opts.push(x)} }
    opts=shuffle(opts);
    const q = dir==="tf" ? front(c) : '<div class="big">'+c.fi+'</div>';
    box.innerHTML='<div class="bar" style="margin:12px 0"><i style="width:'+(n/order.length*100)+'%"></i></div><div class="card" style="cursor:default;min-height:140px">'+q+'</div><div class="opts">'+
      opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+(dir==="tf"?o.fi:(o.tg?'<span class="geez">'+o.tg+'</span> ':'')+'<span class="ph">'+o.ph+'</span>')+'</button>').join("")+'</div>';
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.i], ok=o===c; store.stats.q++; if(ok){store.stats.ok++;score++}else wrong.push(c); save(); updateStat();
      box.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true; if(opts[i]===c)x.classList.add("right"); else if(x===b)x.classList.add("wrong")});
      setTimeout(()=>{n++;ask()}, ok?650:1500);
    });
  }
  $("#deck").onchange=()=>{store.deck=$("#deck").value;save();start()};
  $("#dir").onclick=(e)=>{const d=e.target.dataset.d;if(d){dir=d;store.qdir=d;save();syncSeg();start()}};
  function syncSeg(){document.querySelectorAll("#dir button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.d===dir)))}
  syncSeg(); start();
};

views.build = (root)=>{
  const items = shuffle(D.sentences.filter(s=>s.ph.split(/\s+/).length>=2&&s.ph.split(/\s+/).length<=9));
  let i=0, picked=[], pool=[], solved=0;
  root.innerHTML='<div class="panel"><div class="small">Rakenna tigrinyaksi:</div><h2 id="fi" style="margin:6px 0 10px;font-size:1.25rem"></h2><div class="answer" id="ans" aria-label="Rakennettu lause"></div><div class="tiles" id="tiles"></div><div id="msg" class="msg"></div><div class="row"><button class="btn" id="clear">Tyhjennä</button><button class="btn" id="hint">Vihje</button><button class="btn primary" id="check">Tarkista</button></div><div class="small" id="cnt"></div></div>';
  function load(){
    const s=items[i%items.length]; $("#fi").textContent=s.fi;
    pool=shuffle(s.ph.split(/\s+/).map((w,k)=>({w,k}))); picked=[]; $("#msg").textContent=""; $("#msg").className="msg"; draw();
    $("#cnt").textContent=(s.src?("Lähde: "+(s.src==="C4"?"Class 4 keskustelut":"Handout "+s.src.replace("H",""))):"Lähde: oma sisältö")+" | ratkaistu "+solved;
  }
  function draw(){
    $("#ans").innerHTML=picked.map((t,idx)=>'<button class="tile" data-a="'+idx+'">'+t.w+'</button>').join("");
    $("#tiles").innerHTML=pool.filter(t=>!picked.includes(t)).map(t=>'<button class="tile" data-p="'+t.k+'">'+t.w+'</button>').join("");
  }
  const s0=()=>items[i%items.length];
  root.onclick=(e)=>{
    const b=e.target.closest("button"); if(!b)return;
    if(b.dataset.p!==undefined){const t=pool.find(x=>x.k===+b.dataset.p&&!picked.includes(x));if(t){picked.push(t);draw()}}
    else if(b.dataset.a!==undefined){picked.splice(+b.dataset.a,1);draw()}
  };
  $("#clear").onclick=()=>{picked=[];draw();$("#msg").textContent=""};
  $("#hint").onclick=()=>{const w=s0().ph.split(/\s+/);$("#msg").className="msg";$("#msg").textContent="Ensimmäinen sana: "+w[0]};
  $("#check").onclick=()=>{
    const want=s0().ph.split(/\s+/).join(" "), got=picked.map(t=>t.w).join(" ");
    if(got===want){$("#msg").className="msg good";$("#msg").textContent="Oikein!";solved++;i++;setTimeout(load,900)}
    else if(picked.length===pool.length){$("#msg").className="msg bad";$("#msg").textContent="Ei aivan. Oikea: "+want}
    else {$("#msg").className="msg bad";$("#msg").textContent="Lause ei ole vielä valmis."}
  };
  load();
};

views.fidel = (root)=>{
  let mode="chart";

      $("#fb").innerHTML=D.fidel.map(f=>'<h2 style="font-size:1rem;margin:14px 0 4px">'+f.name+' <span class="small">(Handout '+f.src.replace("H","")+')</span></h2><div class="fid">'+f.g.map((g,k)=>'<div><div class="g">'+g+'</div><div class="p">'+f.p[k]+'</div></div>').join("")+'</div><div class="small">'+f.words.map(w=>'<span class="geez">'+w[0]+'</span> <span class="ph">'+w[1]+'</span> = '+w[2]).join(" | ")+'</div>').join("");

views.talk = (root)=>{
  const C=D.convos||[];
  if(!C.length){root.innerHTML='<div class="panel">Ei keskusteluja. Lisää niitä content.txt-tiedostoon (#CONVERSATION).</div>';return}
  const esc=(s)=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  let ser=null, mode=store.talkMode||"answer", ci=0, step=0, score=0, total=0, opts=null, picked=null, revealed=false, showFi=false;
  root.innerHTML='<div class="panel"><div class="seg" id="seg"><button data-m="answer">Vastaa</button><button data-m="ask">Kysy</button><button data-m="read">Lue</button></div>'+
    '<div class="small" id="how" style="margin-top:8px"></div><div class="row"><select id="sel" aria-label="Keskustelu"></select><button class="btn" id="rand" style="flex:0 0 auto">Satunnainen</button></div><div class="row"><button class="btn" id="series">Aloita 5 keskustelun sarja</button></div><div class="small" id="sinfo"></div>'+
    '<div class="row"><button class="btn" id="fi" aria-pressed="false">Näytä suomennokset</button></div><div id="chat"></div><div id="act"></div></div>';
  $("#sel").innerHTML=C.map((c,k)=>'<option value="'+k+'">'+(k+1)+'. '+esc(c.title)+'</option>').join("");
  const role=()=>mode==="ask"?"A":"B";
  function adv(){const L=C[ci].lines; while(step<L.length&&L[step].s!==role())step++}
  function start(k){ci=k;step=0;score=0;total=0;opts=null;picked=null;revealed=false;if(mode!=="read")adv();draw()}
  function distract(line){
    const pool=[]; C.forEach((c,k)=>{if(k!==ci)c.lines.forEach(l=>{if(l.s===line.s&&l.ph!==line.ph&&!pool.includes(l.ph))pool.push(l.ph)})});
    return shuffle(shuffle(pool).slice(0,2).concat([line.ph]));
  }
  function bubble(l,me,fi){return '<div class="msg'+(me?' me':'')+'"><div class="who">'+(me?'Sinä':'Keskustelukumppani')+'</div><div class="ph">'+esc(l.ph)+'</div>'+(fi?'<div class="small">'+esc(l.fi)+'</div>':'')+'</div>'}
  function draw(){
    const c=C[ci], L=c.lines; $("#sel").value=ci;
    root.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.m===mode)));
    $("#fi").setAttribute("aria-pressed",String(showFi)); $("#fi").textContent=showFi?"Piilota suomennokset":"Näytä suomennokset";
    $("#how").textContent= mode==="answer"?"Kumppani puhuu, sinä vastaat. Sano vastauksesi ääneen ja valitse sitten oikea vaihtoehto."
      : mode==="ask"?"Sinä aloitat. Sano lause tigrinyaksi ääneen suomennoksen mukaan ja tarkista malli."
      : "Lue koko keskustelu ja harjoittele rooleja parin kanssa.";
    if(mode==="read"){
      $("#chat").innerHTML=L.map(l=>bubble(l,l.s==="B",true)).join("");
      $("#act").innerHTML='<div class="row"><button class="btn primary" id="nx">Seuraava keskustelu</button></div>';
      $("#nx").onclick=()=>start((ci+1)%C.length); return;
    }
    const shown=L.slice(0,step);
    $("#chat").innerHTML=shown.map(l=>bubble(l,l.s===role(),showFi||l.s===role())).join("");
    const act=$("#act");
    $("#sinfo").textContent=ser?("Sarja: keskustelu "+(ser.n)+" / 5, pisteet "+ser.score+" / "+ser.total):"";
    if(step>=L.length){
      const rnd2=()=>start(Math.floor(Math.random()*C.length));
      if(ser&&!ser.counted){ser.score+=score;ser.total+=total;ser.counted=true;$("#sinfo").textContent="Sarja: keskustelu "+ser.n+" / 5, pisteet "+ser.score+" / "+ser.total}
      if(ser&&ser.n>=5){
        act.innerHTML='<div class="panel" style="background:var(--surface-2)"><b>Sarja valmis.</b> Yhteensä oikein '+ser.score+' / '+ser.total+'.</div><div class="row"><button class="btn primary" id="nx">Uusi sarja</button></div>';
        $("#nx").onclick=()=>{ser={n:1,score:0,total:0,counted:false};rnd2()}; return;
      }
      act.innerHTML='<div class="panel" style="background:var(--surface-2)"><b>Valmis.</b> Oikein '+score+' / '+total+'.</div><div class="row"><button class="btn" id="again">Toista</button><button class="btn primary" id="nx">Seuraava satunnainen</button></div>';
      $("#again").onclick=()=>{if(ser)ser.counted=false;start(ci)}; $("#nx").onclick=()=>{if(ser){ser.n++;ser.counted=false}rnd2()}; return;
    }
    const cur=L[step];
    if(mode==="answer"){
      if(!opts)opts=distract(cur);
      act.innerHTML='<div class="small">Valitse oikea vastaus:</div><div class="opts">'+opts.map((o,k)=>'<button class="opt'+(picked!==null?(o===cur.ph?' right':(k===picked?' wrong':'')):'')+'" data-k="'+k+'"'+(picked!==null?' disabled':'')+'><span class="ph">'+esc(o)+'</span></button>').join("")+'</div>'+
        (picked!==null?'<div class="small" style="margin-top:8px">'+esc(cur.fi)+'</div><div class="row"><button class="btn primary" id="go">Jatka</button></div>':'');
      act.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{picked=+b.dataset.k;total++;store.stats.q++;if(opts[picked]===cur.ph){score++;store.stats.ok++}save();updateStat();draw()});
      const g=$("#go"); if(g)g.onclick=()=>{step++;opts=null;picked=null;adv();draw()};
    } else {
      act.innerHTML='<div class="card" style="cursor:default;min-height:100px"><div class="small">Sano tigrinyaksi:</div><div style="font-size:1.15rem">'+esc(cur.fi)+'</div>'+(revealed?'<div class="ph" style="font-size:1.25rem">'+esc(cur.ph)+'</div>':'')+'</div>'+
        (revealed?'<div class="row"><button class="btn good" id="ok">Osasin</button><button class="btn bad" id="no">Harjoittele lisää</button></div>':'<div class="row"><button class="btn primary" id="rv">Näytä malli</button></div>');
      const rv=$("#rv"); if(rv)rv.onclick=()=>{revealed=true;draw()};
      const done=(ok)=>{total++;store.stats.q++;if(ok){score++;store.stats.ok++}save();updateStat();step++;revealed=false;adv();draw()};
      const ok=$("#ok"); if(ok){ok.onclick=()=>done(true);$("#no").onclick=()=>done(false)}
    }
  }
  root.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;store.talkMode=mode;save();if(mode==="read")ser=null;start(ci)});
  $("#sel").onchange=()=>{ser=null;start(+$("#sel").value)};
  $("#rand").onclick=()=>{ser=null;start(Math.floor(Math.random()*C.length))};
  $("#series").onclick=()=>{if(mode==="read"){mode="answer";store.talkMode=mode;save()}ser={n:1,score:0,total:0,counted:false};start(Math.floor(Math.random()*C.length))};
  $("#fi").onclick=()=>{showFi=!showFi;draw()};
  start(0);
};

views.exam = (root)=>{
  const esc=(s)=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const CAT={w1:"Sanat: tigrinya suomeksi",w2:"Sanat: suomi tigrinyaksi",w3:"Sanat: Ge'ez-kirjoitus",s:"Lauseet",c:"Keskustelu"};
  const GROUPS={words:["w1","w2","w3"],sent:["s"],conv:["c"]};
  const sel=Object.assign({words:true,sent:true,conv:true},store.examSel||{});
  const cards=allCards.filter(c=>c.ph&&c.fi);
  function opts(correct,pool,n){const s=new Set([correct]);shuffle(pool).forEach(x=>{if(x&&s.size<(n||4)&&!s.has(x))s.add(x)});return shuffle([...s])}
  const gens={
    w1(){const c=rnd(cards);return {cat:"w1",prompt:'<span class="ph big">'+esc(c.ph)+'</span>'+(c.tg?'<div class="geez big">'+esc(c.tg)+'</div>':""),correct:c.fi,options:opts(c.fi,cards.map(x=>x.fi)),key:"w1"+c.ph}},
    w2(){const c=rnd(cards);return {cat:"w2",prompt:'<span class="big">'+esc(c.fi)+'</span>',correct:c.ph,options:opts(c.ph,cards.map(x=>x.ph)),ph:true,key:"w2"+c.ph}},
    w3(){const L=cards.filter(c=>c.tg);if(!L.length)return null;const c=rnd(L);return {cat:"w3",prompt:'<span class="geez big">'+esc(c.tg)+'</span>',correct:c.ph,options:opts(c.ph,L.map(x=>x.ph)),ph:true,note:c.fi,key:"w3"+c.tg}},
    s(){const S=D.sentences.filter(x=>x.ph&&x.fi);if(S.length<4)return null;const s=rnd(S);return {cat:"s",prompt:'<span class="ph big">'+esc(s.ph)+'</span>',correct:s.fi,options:opts(s.fi,S.map(x=>x.fi)),key:"s"+s.ph}},
    c(){const C=D.convos||[];const pairs=[];C.forEach((cv,k)=>cv.lines.forEach((l,i)=>{if(l.s==="B"&&i>0&&cv.lines[i-1].s==="A")pairs.push({k,q:cv.lines[i-1],a:l})}));if(pairs.length<4)return null;const p=rnd(pairs);const pool=pairs.filter(x=>x.k!==p.k).map(x=>x.a.ph);return {cat:"c",prompt:'<div class="small">Kumppani sanoo:</div><span class="ph big">'+esc(p.q.ph)+'</span>',correct:p.a.ph,options:opts(p.a.ph,pool),ph:true,note:p.q.fi+" / "+p.a.fi,key:"c"+p.q.ph+p.a.ph}}
  };
  let qs=[], i=0, picked=null, res=[], len=20;
  function build(n){
    const gs=Object.keys(GROUPS).filter(g=>sel[g]);const out=[],seen=new Set();let guard=0,k=0;
    while(gs.length&&out.length<n&&guard++<n*40){const g=gs[k++%gs.length];const names=GROUPS[g];const q=gens[names[Math.floor(Math.random()*names.length)]]();if(q&&q.options.length>=3&&!seen.has(q.key)){seen.add(q.key);out.push(q)}}
    return shuffle(out);
  }
  function start(){qs=build(len);i=0;picked=null;res=[];draw()}
  function intro(){
    const ex=store.exam||{best:0,hist:[]};
    root.innerHTML='<div class="panel"><h2 style="font-size:1.2rem">Koe: kaikki sisältö sekaisin</h2><p class="small">Koe sekoittaa sanoja, lauseita ja keskusteluja kaikista handouteista. Kaikki vastaukset valitaan vaihtoehdoista, kirjoittamista ei tarvita. Uusi sisältö content.txt-tiedostosta tulee mukaan automaattisesti.</p>'+
      '<div class="row" id="grp"><label class="small"><input type="checkbox" data-g="words"> Sanat</label><label class="small"><input type="checkbox" data-g="sent"> Lauseet</label><label class="small"><input type="checkbox" data-g="conv"> Keskustelut</label></div><div class="row"><label for="len" class="small">Kysymyksiä</label><select id="len"><option value="10">10 (pikakoe)</option><option value="20" selected>20</option><option value="40">40</option><option value="60">60 (iso koe)</option></select></div>'+
      '<div class="row"><button class="btn primary" id="go">Aloita koe</button></div>'+
      (ex.hist.length?'<div class="small" style="margin-top:10px">Paras tulos: '+ex.best+' %. Viimeisimmät: '+ex.hist.slice(-5).reverse().map(h=>h.pct+' % ('+h.n+')').join(", ")+'</div>':"")+'</div>';
    $("#len").value=String(len);
    root.querySelectorAll("#grp input").forEach(c=>{c.checked=!!sel[c.dataset.g];c.onchange=()=>{sel[c.dataset.g]=c.checked;store.examSel=sel;save();$("#go").disabled=!Object.values(sel).some(Boolean)}});
    $("#go").disabled=!Object.values(sel).some(Boolean);
    $("#go").onclick=()=>{len=+$("#len").value;start()};
  }
  function draw(){
    if(i>=qs.length)return finish();
    const q=qs[i];
    root.innerHTML='<div class="panel"><div class="bar"><i style="width:'+Math.round(i/qs.length*100)+'%"></i></div><div class="small" style="margin:6px 0">Kysymys '+(i+1)+' / '+qs.length+' | '+CAT[q.cat]+'</div><div class="card" style="cursor:default;min-height:120px;align-items:center">'+q.prompt+'</div>'+
      '<div class="opts" id="o">'+q.options.map((o,k)=>'<button class="opt'+(picked!==null?(o===q.correct?' right':(k===picked?' wrong':'')):'')+'" data-k="'+k+'"'+(picked!==null?' disabled':'')+'>'+(q.ph?'<span class="ph">'+esc(o)+'</span>':esc(o))+'</button>').join("")+'</div>'+
      (picked!==null?'<div class="small" style="margin-top:8px">'+(q.note?esc(q.note):"")+'</div><div class="row"><button class="btn primary" id="nx">'+(i+1>=qs.length?"Näytä tulos":"Seuraava")+'</button></div>':"")+'</div>';
    root.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{picked=+b.dataset.k;const ok=q.options[picked]===q.correct;res.push({q,ok,given:q.options[picked]});store.stats.q++;if(ok)store.stats.ok++;save();updateStat();draw()});
    const nx=$("#nx"); if(nx)nx.onclick=()=>{i++;picked=null;draw()};
  }
  function finish(){
    const ok=res.filter(r=>r.ok).length, n=res.length, pct=Math.round(ok/n*100);
    store.exam=store.exam||{best:0,hist:[]}; store.exam.hist.push({pct,n}); store.exam.hist=store.exam.hist.slice(-20); if(pct>store.exam.best)store.exam.best=pct; save();
    const by={};res.forEach(r=>{const c=by[r.q.cat]=by[r.q.cat]||{ok:0,n:0};c.n++;if(r.ok)c.ok++});
    const wrong=res.filter(r=>!r.ok);
    const lvl=pct>=90?"Erinomaista":pct>=70?"Hyvä":pct>=50?"Kehittyy":"Harjoitellaan lisää";
    root.innerHTML='<div class="panel"><h2 style="font-size:1.2rem">'+lvl+': '+ok+' / '+n+' ('+pct+' %)</h2><div class="small">Paras tulos: '+store.exam.best+' %</div>'+
      '<table style="width:100%;border-collapse:collapse;margin:10px 0">'+Object.keys(by).map(k=>'<tr><td style="padding:4px 0">'+CAT[k]+'</td><td style="text-align:right">'+by[k].ok+' / '+by[k].n+'</td></tr>').join("")+'</table>'+
      (wrong.length?'<h3 style="font-size:1rem">Väärin menneet</h3>'+wrong.map(r=>'<div class="msg"><div class="small">'+CAT[r.q.cat]+'</div><div>'+r.q.prompt+'</div><div class="small">Oikea: <b>'+(r.q.ph?'<span class="ph">'+esc(r.q.correct)+'</span>':esc(r.q.correct))+'</b>'+(r.q.note?' ('+esc(r.q.note)+')':"")+'</div></div>').join(""):'<p>Ei virheitä.</p>')+
      '<div class="row">'+(wrong.length?'<button class="btn" id="retry">Kokeile virheitä uudelleen</button>':"")+'<button class="btn primary" id="again">Uusi koe</button></div></div>';
    const rt=$("#retry"); if(rt)rt.onclick=()=>{qs=wrong.map(r=>{const q=r.q;return Object.assign({},q,{options:shuffle(q.options)})});i=0;picked=null;res=[];draw()};
    $("#again").onclick=()=>{intro()};
  }
  intro();
};

// ---- shell ----
const nav=$("#nav"), main=$("#main");
nav.innerHTML=TABS.map(t=>'<button class="tab" role="tab" data-t="'+t[0]+'"><b>'+t[2]+'</b>'+t[1]+'</button>').join("");
function go(t,push){
  if(!views[t])t="cards";
  nav.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.t===t)));
  main.innerHTML=""; main.onclick=null; views[t](main);
  if(push) try{history.replaceState(null,"","#"+t)}catch(e){}
  window.scrollTo(0,0);
}
nav.onclick=(e)=>{const b=e.target.closest(".tab");if(b)go(b.dataset.t,true)};
window.addEventListener("hashchange",()=>go(location.hash.slice(1),false));
updateStat();
loadContent().then(src=>{
  setDecks();
  const n=allCards.length;
  $("#stat").dataset.n="Sanoja: "+n+(src==="file"?"":" (sisäänrakennettu)");
  updateStat();
  go(location.hash.slice(1)||"cards",false);
});
</script>
